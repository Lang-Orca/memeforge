<linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#7df9ff"/>
<stop offset="100%" stop-color="#1e90ff"/>
</linearGradient>
</defs>

